- id: VC01
  protocol: scs
  category: cone_named
  difficulty: 2
  en: Give me all AllWISE entries within 1 arcmin of Bode's Galaxy.
  es: Dame todas las entradas de AllWISE a menos de 1 minutos de arco de la galaxia de Bode.
  gold:
    target: M81
    catalog: allwise
    radius_deg: 0.016667
    service: irsa_tap
    compare: set
    tol_deg: 0.01
    adql: SELECT designation FROM allwise_p3as_psd WHERE CONTAINS(POINT('ICRS',ra,dec),CIRCLE('ICRS',{ra},{dec},0.016667))=1
  split: test
- id: VC02
  protocol: scs
