# VOAI-Bench v0 — 50 ítems base (EN/ES). Gold con coordenadas se completa con build_gold.py (Sesame).
# Campos:
#   id, protocol: sia|scs|tap|ssa|none, category, difficulty: 1 (explícita) 2 (requiere conocimiento) 3 (ambigua/compuesta)
#   en / es: consulta en lenguaje natural
#   gold:
#     target: nombre resoluble por Sesame (o null si se dan coordenadas)
#     ra, dec: grados ICRS (si vienen en la consulta)
#     accept_otypes: para consultas por clase de objeto (otype SIMBAD)
#     band_um: [min, max] en micrómetros (rango aceptable de la imagen/espectro); null = cualquiera
#     radius_deg: radio del cono (scs)
#     catalog: gaia_dr3 | 2mass_psc | allwise (scs)
#     adql: consulta de referencia (tap/scs); {ra} {dec} se reemplazan con coordenadas gold
#     service: gaia_esa | irsa_tap
#     compare: set | ordered | scalar  (cómo comparar resultados TAP)
#     abstain: true si el sistema debe declinar

items:
